# 插件的唯一标识名 (不要改)
name: astrbot_plugin_ds_status

# 插件展示名
display_name: DS Status (状态页订阅)

# 插件的一句话简介
desc: 订阅 DeepSeek 状态页 RSS 与邮箱通知，状态一变就推送一张图片卡片，支持事件级去重、多会话订阅、关键词过滤与命令权限控制

# 插件的详细帮助信息
help: |
  两个来源：状态页 RSS（默认 https://status.deepseek.com/feed.rss）和邮箱通知（可选，走 IMAP）。
  同一次故障会连发十几封邮件，插件按「事件编号 + 状态」去重，只推几次真正的状态变化。
  /ds订阅 让当前会话开始接收推送，/ds状态 看一眼最新条目，/ds检查 立刻轮询一次。
  首次加载只静默记录，不会刚装好就刷一屏旧消息。

# (可选) 插件 Logo 文件名（对应插件目录下的 logo.png）
# 使用 GitHub 绝对链接，避免 Cloud 构建时资源不同步
logo: "https://raw.githubusercontent.com/Fangnai-byte/astrbot_plugin_ds_status/main/logo.png"

# (可选) 你的 GitHub 仓库地址
repo: "https://github.com/Fangnai-byte/astrbot_plugin_ds_status"

# 插件版本号
version: 0.3.0

# 作者名
author: Fangnai-byte

# 声明支持的平台
support_platforms:
  - aiocqhttp
  - telegram
  - discord
  - lark
  - wecom

# 声明支持的 AstrBot 版本范围
astrbot_version: ">=v4.12.0"
